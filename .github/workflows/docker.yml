name: Docker

# 반 배포 이미지가 빌드되고 compose로 뜨는지 확인한다 (v0.6 N3, D11, v0.6.2 N3, D4).
# 이미지가 2.5GB 안팎이라 Docker 관련 파일이 바뀐 PR과 main push에서만 돈다. 올리기는 publish.yml.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - requirements.txt
      - requirements-ocr.txt
      - scripts/warm_ocr.py
      - scripts/check_image.sh
      - agent/ocr.py
      - start/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - requirements.txt
      - requirements-ocr.txt
      - scripts/warm_ocr.py
      - scripts/check_image.sh
      - agent/ocr.py
      - start/**
      - .github/workflows/docker.yml

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (OCR 모델 받기 포함)
        run: docker compose build
      - name: Build base (OCR 없음)
        run: docker build --target base -t jobvis:base .
      - name: Image size
        run: |
          docker image ls jobvis
          # 받는 크기에 가까운 값(압축). 시작 파일 질문의 "약 N MB 더"를 맞출 때 씀 (v0.6.2 N2)
          for image in jobvis:base jobvis:0.6; do
            echo "$image 압축 $(( $(docker save "$image" | gzip -1 | wc -c) / 1000000 ))MB"
          done
      - name: 기본 이미지에 OCR 없음
        run: |
          docker run --rm jobvis:base python -c "
          import importlib.util, os
          assert importlib.util.find_spec('paddleocr') is None
          from agent import ocr
          assert not ocr.available() and 'JOBVIS 시작.bat' in ocr.INSTALL_HINT
          print('기본 이미지 OCR 없음, 안내 문구 맞음')
          "
      - name: 비밀 파일 검사
        run: |
          sh scripts/check_image.sh jobvis:base
          sh scripts/check_image.sh jobvis:0.6
      - name: 시작 파일 compose 확인
        run: docker compose -f start/compose.yml config -q
      - name: Start
        run: docker compose up -d --wait
      - name: Health
        run: curl -fsS http://127.0.0.1:8501/_stcore/health
      - name: DB 저장 확인
        run: |
          docker compose exec -T app python -c "
          from agent import sheets, store
          assert store.kind() == 'db'
          number = store.append_row(['회사', '직무', '', '', 'url', '1'])
          store.set_check(number, True)
          assert store.read_rows()[0]['check'] == 'TRUE'
          print('DB 저장 확인함')
          "
      - name: OCR 확인
        run: docker compose exec -T app python -c "from agent import ocr; assert ocr.available(); ocr._model(); print('OCR 모델 있음')"
      - name: Logs
        if: always()
        run: docker compose logs --tail 50
      - name: Stop
        if: always()
        run: docker compose down -v
